name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Signals backtest (EN + PL)
        run: python3 tests/run_tests.py
      - name: Scripts stay identical in both editions
        run: cmp plugins/step-back/skills/step-back/scripts/signals.py plugins/krok-wstecz/skills/krok-wstecz/scripts/signals.py
      - name: Installer syntax and dry run
        run: bash -n install.sh && ./install.sh --dry-run && ./install.sh --lang pl --dry-run
      - name: JSON manifests parse
        run: for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json; do python3 -m json.tool "$f" > /dev/null; done
